## Ryobi Example: Web Application with Database
##
## Deploys a web app with a PostgreSQL database and frontend.
## Placement rules determine which environment handles the resources.

apiVersion: ryobi/v1
kind: Application
metadata:
  name: webapp

resources:
  - name: database
    type: Ryobi.Compute/containers
    parameters:
      name: postgres
      image: postgres:16-alpine
      replicas: 1
      ports:
        - container_port: 5432
      cpu_request: "250m"
      memory_request: "256Mi"
      env:
        - name: POSTGRES_DB
          value: webapp
        - name: POSTGRES_USER
          value: webapp
        - name: POSTGRES_PASSWORD
          value: "s3cret-p@ssw0rd"

  - name: api
    type: Ryobi.Compute/containers
    parameters:
      name: api
      image: myregistry.io/webapp-api:latest
      replicas: 3
      ports:
        - container_port: 8080
      cpu_request: "250m"
      cpu_limit: "500m"
      memory_request: "256Mi"
      memory_limit: "512Mi"
      env:
        - name: DATABASE_URL
          value: "postgres://webapp:s3cret-p@ssw0rd@postgres:5432/webapp"
        - name: LOG_LEVEL
          value: info

  - name: frontend
    type: Ryobi.Compute/containers
    parameters:
      name: frontend
      image: myregistry.io/webapp-frontend:latest
      replicas: 2
      ports:
        - container_port: 3000
      cpu_request: "100m"
      memory_request: "128Mi"
      env:
        - name: API_URL
          value: "http://api:8080"
