## Ryobi Example: Placement-Based Deployment
##
## This application relies on administrator-defined placement rules
## to automatically select the best environment for each resource.
## No explicit environment or recipe is specified.
##
## Prerequisites:
##   1. Start ryobid:          ./dist/ryobid
##   2. Start EU env agent:    ./dist/ryobi-env examples/env-eu.yaml
##   3. Start US env agent:    ./dist/ryobi-env examples/env-us.yaml
##   4. Create placement rules:
##        ./dist/ryobi placement create eu-containers \
##          --resource-type Ryobi.Compute/containers \
##          --region eu-west-1 --sovereignty eu --priority 10
##        ./dist/ryobi placement create cost-optimized \
##          --resource-type Ryobi.Compute/containers \
##          --cost minimize --priority 1
##   5. Deploy:
##        ./dist/ryobi deploy examples/placement-app.yaml
##
## Expected placement:
##   - The "eu-containers" rule (priority 10) places containers in eu-west-1
##   - If no EU env matches, falls back to "cost-optimized" rule (priority 1)

apiVersion: ryobi/v1
kind: Application
metadata:
  name: global-app

resources:
  - name: api
    type: Ryobi.Compute/containers
    parameters:
      name: api
      image: myregistry.io/api:latest
      replicas: 3
      ports:
        - container_port: 8080

  - name: worker
    type: Ryobi.Compute/containers
    parameters:
      name: worker
      image: myregistry.io/worker:latest
      replicas: 5
