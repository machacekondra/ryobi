## Ryobi Example: Multi-VM Application
##
## Deploys a web server VM and a database VM using placement rules.

apiVersion: ryobi/v1
kind: Application
metadata:
  name: multi-vm-app

resources:
  - name: web-server
    type: Ryobi.Compute/virtualMachines
    parameters:
      name: web-server
      cpu_cores: 2
      memory: 2Gi
      disk_image: "docker://quay.io/containerdisks/ubuntu:22.04"
      disk_size: 20Gi
      running: true
      cloud_init_enabled: true
      cloud_init_user_data: |
        #cloud-config
        hostname: web-server
        packages:
          - nginx
        runcmd:
          - systemctl enable nginx
          - systemctl start nginx
      service_ports:
        - name: http
          port: 80
          target_port: 80
      service_type: LoadBalancer

  - name: db-server
    type: Ryobi.Compute/virtualMachines
    parameters:
      name: db-server
      cpu_cores: 4
      memory: 8Gi
      disk_image: "docker://quay.io/containerdisks/ubuntu:22.04"
      disk_size: 100Gi
      storage_class: fast-ssd
      running: true
      cloud_init_enabled: true
      cloud_init_user_data: |
        #cloud-config
        hostname: db-server
        packages:
          - postgresql
          - postgresql-contrib
        runcmd:
          - systemctl enable postgresql
          - systemctl start postgresql
      service_ports:
        - name: postgres
          port: 5432
          target_port: 5432
      service_type: ClusterIP
