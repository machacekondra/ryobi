## Ryobi Example: KubeVirt Virtual Machine
##
## Deploys a Fedora VM using placement rules.

apiVersion: ryobi/v1
kind: Application
metadata:
  name: fedora-vm-app

resources:
  - name: fedora-vm
    type: Ryobi.Compute/virtualMachines
    parameters:
      name: fedora-dev
      cpu_cores: 2
      memory: 2Gi
      disk_image: "docker://quay.io/containerdisks/fedora:latest"
      disk_size: 20Gi
      running: true
      cloud_init_enabled: true
      cloud_init_user_data: |
        #cloud-config
        hostname: fedora-dev
        users:
          - name: developer
            sudo: ALL=(ALL) NOPASSWD:ALL
            ssh_authorized_keys:
              - ssh-ed25519 AAAA... your-key-here
        packages:
          - vim
          - git
          - curl
      service_ports:
        - name: ssh
          port: 22
          target_port: 22
      service_type: NodePort
