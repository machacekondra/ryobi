apiVersion: ryobi/v1
kind: Environment
metadata:
  name: production
providers:
  kubernetes:
    scope: default
recipes:
  Ryobi.Compute/containers:
    kubernetes:
      templateKind: terraform
      templatePath: ./recipes/kubernetes-pod
      parameters:
        namespace: ecommerce
---
apiVersion: ryobi/v1
kind: Application
metadata:
  name: ecommerce
  environment: production

resources:
  - name: redis
    type: Ryobi.Compute/containers
    recipe: kubernetes
    parameters:
      name: redis
      image: redis:7-alpine
      replicas: 1
      ports:
        - container_port: 6379
      cpu_request: "100m"
      memory_request: "128Mi"
      memory_limit: "256Mi"

  - name: user-service
    type: Ryobi.Compute/containers
    recipe: kubernetes
    parameters:
      name: user-service
      image: myregistry.io/user-service:v2.1
      replicas: 2
      ports:
        - container_port: 8081
      cpu_request: "200m"
      memory_request: "256Mi"
      env:
        - name: REDIS_URL
          value: "redis://redis.ecommerce.svc.cluster.local:6379"

  - name: order-service
    type: Ryobi.Compute/containers
    recipe: kubernetes
    parameters:
      name: order-service
      image: myregistry.io/order-service:v1.8
      replicas: 2
      ports:
        - container_port: 8082
      cpu_request: "200m"
      memory_request: "256Mi"
      env:
        - name: REDIS_URL
          value: "redis://redis.ecommerce.svc.cluster.local:6379"
        - name: USER_SERVICE_URL
          value: "http://user-service.ecommerce.svc.cluster.local:8081"

  - name: api-gateway
    type: Ryobi.Compute/containers
    recipe: kubernetes
    parameters:
      name: api-gateway
      image: myregistry.io/api-gateway:v3.0
      replicas: 3
      ports:
        - container_port: 8080
      cpu_request: "250m"
      cpu_limit: "1"
      memory_request: "256Mi"
      memory_limit: "512Mi"
      env:
        - name: USER_SERVICE_URL
          value: "http://user-service.ecommerce.svc.cluster.local:8081"
        - name: ORDER_SERVICE_URL
          value: "http://order-service.ecommerce.svc.cluster.local:8082"
