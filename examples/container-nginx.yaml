## Ryobi Example: Nginx Container
##
## Prerequisites:
##   1. Start ryobid:       ./dist/ryobid
##   2. Start env agent:    ./dist/ryobi-env examples/env-kubernetes.yaml
##   3. Create placement:   ./dist/ryobi placement create containers \
##                            --resource-type Ryobi.Compute/containers
##   4. Deploy this app:    ./dist/ryobi deploy examples/container-nginx.yaml

apiVersion: ryobi/v1
kind: Application
metadata:
  name: nginx-app

resources:
  - name: nginx
    type: Ryobi.Compute/containers
    parameters:
      name: nginx
      image: nginx:1.25-alpine
      replicas: 2
      ports:
        - container_port: 80
      cpu_request: "100m"
      memory_request: "64Mi"
