apiVersion: ryobi/v1
kind: Environment
metadata:
  name: dev
providers:
  kubernetes:
    scope: default
recipes:
  Ryobi.Compute/containers:
    kubernetes:
      templateKind: terraform
      templatePath: ./recipes/kubernetes-pod
recipeConfig:
  terraform:
    providers:
      kubernetes:
        config_path: "~/.kube/config"
---
apiVersion: ryobi/v1
kind: Application
metadata:
  name: nginx-app
  environment: dev

resources:
  - name: nginx
    type: Ryobi.Compute/containers
    recipe: kubernetes
    parameters:
      name: nginx
      image: nginx:1.25-alpine
      replicas: 2
      ports:
        - container_port: 80
      cpu_request: "100m"
      memory_request: "64Mi"
