syntax = "proto3";

package ryobi.environment.v1;

option go_package = "github.com/ryobi-project/ryobi/pkg/grpcapi";

// EnvironmentService is the gRPC service exposed by ryobid.
// Environment agents connect to this service to register themselves,
// watch for resource operations, and report results.
service EnvironmentService {
  // Register registers an environment agent with the server.
  // The server stores the environment configuration and marks it as active.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Unregister removes an environment agent registration.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);

  // WatchResources opens a server-streaming RPC. The server pushes
  // resource operation events (deploy/delete) to the environment agent
  // whenever a resource targeting this environment is created or deleted.
  rpc WatchResources(WatchRequest) returns (stream ResourceEvent);

  // ReportResult is called by the environment agent to report the
  // outcome of a resource operation (success or failure with outputs).
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

// RegisterRequest is sent by the environment agent on startup.
message RegisterRequest {
  string environment_name = 1;
  EnvironmentConfig config = 2;
  repeated RecipeRegistration recipes = 3;
}

message EnvironmentConfig {
  map<string, ProviderConfig> providers = 1;
  map<string, string> terraform_providers = 2; // provider name -> JSON config
}

message ProviderConfig {
  string scope = 1;
}

message RecipeRegistration {
  string resource_type = 1;  // e.g. "Ryobi.Compute/containers"
  string recipe_name = 2;    // e.g. "kubernetes"
  string template_path = 3;  // absolute path to terraform module
  map<string, string> default_parameters = 4;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  string environment_id = 3;
}

message UnregisterRequest {
  string environment_name = 1;
}

message UnregisterResponse {
  bool success = 1;
}

// WatchRequest initiates a watch stream for a specific environment.
message WatchRequest {
  string environment_name = 1;
}

// ResourceEvent is pushed from the server to the environment agent.
message ResourceEvent {
  string operation_id = 1;
  string resource_id = 2;
  string resource_name = 3;
  string resource_type = 4;
  string recipe_name = 5;
  OperationType operation = 6;
  map<string, string> parameters = 7;
  string application_name = 8;
}

enum OperationType {
  DEPLOY = 0;
  DELETE = 1;
}

// ReportResultRequest is sent by the environment agent after processing.
message ReportResultRequest {
  string operation_id = 1;
  string resource_id = 2;
  bool success = 3;
  string error_message = 4;
  map<string, string> outputs = 5;
}

message ReportResultResponse {
  bool acknowledged = 1;
}
