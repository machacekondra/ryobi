syntax = "proto3";

package ryobi.environment.v1;

option go_package = "github.com/ryobi-project/ryobi/pkg/grpcapi";

// EnvironmentService is the gRPC service exposed by ryobid.
service EnvironmentService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
  rpc WatchResources(WatchRequest) returns (stream ResourceEvent);
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// --- Registration ---

message RegisterRequest {
  string environment_name = 1;
  EnvironmentConfig config = 2;
  repeated RecipeRegistration recipes = 3;
  EnvironmentCapabilities capabilities = 4;
}

message EnvironmentConfig {
  map<string, ProviderConfig> providers = 1;
  map<string, string> terraform_providers = 2;
}

message ProviderConfig {
  string scope = 1;
}

message RecipeRegistration {
  string resource_type = 1;
  string recipe_name = 2;
  string template_path = 3;
  map<string, string> default_parameters = 4;
}

// EnvironmentCapabilities describes what an environment can do.
// Static capabilities are set in config and sent at registration.
message EnvironmentCapabilities {
  string region = 1;
  string sovereignty = 2;
  repeated string capabilities = 3;  // e.g. ["gpu", "high-memory"]
  double cost_per_hour = 4;
  int32 max_replicas = 5;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
  string environment_id = 3;
}

message UnregisterRequest {
  string environment_name = 1;
}

message UnregisterResponse {
  bool success = 1;
}

// --- Watch ---

message WatchRequest {
  string environment_name = 1;
}

message ResourceEvent {
  string operation_id = 1;
  string resource_id = 2;
  string resource_name = 3;
  string resource_type = 4;
  string recipe_name = 5;
  OperationType operation = 6;
  map<string, string> parameters = 7;
  string application_name = 8;
}

enum OperationType {
  DEPLOY = 0;
  DELETE = 1;
}

// --- Result ---

message ReportResultRequest {
  string operation_id = 1;
  string resource_id = 2;
  bool success = 3;
  string error_message = 4;
  map<string, string> outputs = 5;
}

message ReportResultResponse {
  bool acknowledged = 1;
}

// --- Live Status ---

message ReportStatusRequest {
  string resource_id = 1;
  string resource_name = 2;
  ResourceHealthStatus health = 3;
}

message ResourceHealthStatus {
  string state = 1;               // "Running", "Degraded", "Down", "Unknown"
  string message = 2;             // human-readable description
  int32 ready_replicas = 3;       // for deployments: ready pods
  int32 desired_replicas = 4;     // for deployments: desired pods
  int64 last_updated = 5;         // unix timestamp
  map<string, string> properties = 6; // provider-specific info
}

message ReportStatusResponse {
  bool acknowledged = 1;
}

// --- Heartbeat ---

message HeartbeatRequest {
  string environment_name = 1;
  int64 available_cpu_millicores = 2;
  int64 available_memory_mb = 3;
  int32 running_resources = 4;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}
