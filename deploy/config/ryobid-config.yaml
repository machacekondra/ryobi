server:
  host: "0.0.0.0"
  port: 9000

databaseProvider:
  provider: postgresql
  postgresql:
    url: "postgres://ryobi:password@localhost:5432/ryobi?sslmode=disable"

queueProvider:
  provider: postgresql

secretProvider:
  provider: file
  file:
    directory: /var/lib/ryobi/secrets

logging:
  level: info

terraform:
  rootDir: /var/lib/ryobi/terraform
  stateBackend: postgresql

workerServer:
  maxOperationConcurrency: 10
  maxOperationRetryCount: 3
